
services:
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    container_name: globalsync_dragonfly
    ports:
      - "6379:6379"
    ulimits:
      memlock: -1
    command: --proactor_threads=4 --cache_mode=true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      
  nats:
    image: nats:latest
    container_name: globalsync_nats
    ports:
      - "4222:4222" # Client port
      - "8222:8222" # HTTP management
    command: -js # Enable JetStream
    healthcheck:
      test: wget -qO- http://localhost:8222/healthz || exit 1
      interval: 10s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: globalsync_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
